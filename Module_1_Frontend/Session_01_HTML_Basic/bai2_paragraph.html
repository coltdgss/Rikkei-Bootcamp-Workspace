<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2 - Paragraph</title>
</head>
<body>
    <h1>Ví dụ về đoạn văn (paragraph)</h1>
    <p>Đây là đoạn văn thứ nhất. HTML cho phép bạn tạo nhiều đoạn văn khác nhau để trình bày nội dung rõ ràng hơn.</p>
    <p>Đây là đoạn văn thứ hai. Mỗi đoạn văn nên có ý nghĩa riêng và dễ đọc.</p>
    <p>Đây là đoạn văn thứ ba với một số <strong>chữ đậm</strong> và <em>chữ nghiêng</em>.</p>
</body>
</html>
