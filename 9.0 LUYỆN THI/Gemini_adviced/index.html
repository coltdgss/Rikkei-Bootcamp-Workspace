<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Học Viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-section">
            <h2>Thông tin học viên</h2>
            <form id="studentForm">
                <div class="input-group">
                    <label>Họ và Tên</label>
                    <input type="text" id="fullName" placeholder="vui lòng nhập tên">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="text" id="email" placeholder="vui lòng nhập email">
                </div>
                <div class="input-group">
                    <label>Số điện thoại</label>
                    <input type="text" id="phone" placeholder="vui lòng nhập số điện thoại">
                </div>
                <div class="input-group">
                    <label>Quê quán</label>
                    <input type="text" id="address" placeholder="vui lòng nhập địa chỉ quê quán">
                </div>
                <div class="input-group">
                    <label>Giới tính</label>
                    <input type="radio" id="genderMale" name="gender" value="Nam" checked> Nam
                    <input type="radio" id="genderFemale" name="gender" value="Nữ"> Nữ
                </div>
                <button type="button" id="btnSave" onclick="saveStudent()">Lưu lại</button>
            </form>
        </div>

        <div class="list-section">
            <h2>Danh sách học viên</h2>
            <div class="action-bar">
                <label>Tìm kiếm tên học viên:</label>
                <input type="text" id="searchInput" placeholder="Nhập tên...">
                <button onclick="searchStudent()">Search</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>Điện thoại</th>
                        <th>Địa chỉ</th>
                        <th>Gender</th>
                        <th>Hành động</th>
                        <th><button onclick="sortAlphabet()">Sắp xếp (alpha b)</button></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
